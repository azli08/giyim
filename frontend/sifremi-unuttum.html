<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8f5">
  <title>Şifremi Unuttum | MODA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="./index.html" aria-label="MODA ana sayfa"><span aria-hidden="true">♥</span><span>MODA</span></a>
    <a class="auth-back-link" href="./giris.html">← Giriş sayfasına dön</a>
  </header>
  <main class="auth-recovery-layout">
    <section class="auth-card auth-recovery-card" aria-labelledby="recovery-title">
      <p class="auth-eyebrow">🔐 HESAP GÜVENLİĞİ</p>
      <h1 id="recovery-title">Şifreni yenile</h1>
      <p class="auth-intro">Hesabına bağlı e-posta adresini yaz. Sana güvenli bir yenileme bağlantısı gönderelim.</p>
      <form class="auth-form" id="forgot-password-form" novalidate>
        <label class="auth-field">
          <span>E-posta adresi</span>
          <input name="email" type="email" autocomplete="email" placeholder="ornek@eposta.com" maxlength="254" required>
        </label>
        <button class="auth-submit" type="submit"><span class="auth-submit-label">✉️ Bağlantı gönder</span><span class="auth-submit-arrow" aria-hidden="true">→</span></button>
        <p class="auth-feedback" role="status" aria-live="polite"></p>
      </form>
      <a class="auth-back-link auth-recovery-back" href="./giris.html">Giriş sayfasına dön</a>
    </section>
    <span class="auth-bottom-note">Miniklere kocaman tarzlar <span aria-hidden="true">♥</span></span>
  </main>
  <script src="./config.js"></script>
  <script src="./i18n.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
