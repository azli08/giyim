<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8f5">
  <meta name="referrer" content="no-referrer">
  <title>Yeni Şifre | MODA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="./index.html" aria-label="MODA ana sayfa"><span aria-hidden="true">♥</span><span>MODA</span></a>
    <a class="auth-back-link" href="./giris.html">← Giriş sayfasına dön</a>
  </header>
  <main class="auth-recovery-layout">
    <section class="auth-card auth-recovery-card" aria-labelledby="reset-title">
      <p class="auth-eyebrow">✨ YENİ BAŞLANGIÇ</p>
      <h1 id="reset-title">Yeni şifreni belirle</h1>
      <p class="auth-intro">Hesabın için güçlü ve daha önce kullanmadığın bir şifre seç.</p>
      <form class="auth-form" id="reset-password-form" novalidate>
        <label class="auth-field">
          <span>Yeni şifre</span>
          <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="En az 8 karakter" required>
        </label>
        <label class="auth-field">
          <span>Yeni şifreyi tekrar yaz</span>
          <input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Şifreni tekrar yaz" required>
        </label>
        <button class="auth-submit" type="submit"><span class="auth-submit-label">💖 Şifremi güncelle</span><span class="auth-submit-arrow" aria-hidden="true">→</span></button>
        <p class="auth-feedback" role="status" aria-live="polite"></p>
      </form>
      <a class="auth-back-link auth-recovery-back" href="./giris.html">Giriş sayfasına dön</a>
    </section>
    <span class="auth-bottom-note">Miniklere kocaman tarzlar <span aria-hidden="true">♥</span></span>
  </main>
  <script src="./config.js"></script>
  <script src="./i18n.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
