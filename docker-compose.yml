services:
  db:
    image: postgres:17-alpine
    container_name: giyim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: giyim_db
      POSTGRES_USER: giyim_user
      POSTGRES_PASSWORD: giyim_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giyim_user -d giyim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
